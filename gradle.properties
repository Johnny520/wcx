# org.gradle.java.home 由 JAVA_HOME 环境变量控制，CI 使用 JDK 21
# 本地开发请设置 JAVA_HOME=/root/.local/share/mise/installs/java/17.0.2
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Xss512k -Dfile.encoding=UTF-8 -XX:+UseParallelGC -XX:ReservedCodeCacheSize=512m
org.gradle.parallel=false
org.gradle.caching=true
org.gradle.configureondemand=true
android.useAndroidX=true
kotlin.code.style=official
kotlin.daemon.jvm.options=-Xmx2g,-XX:MaxMetaspaceSize=512m,-XX:ReservedCodeCacheSize=256m
android.r8.maxWorkers=1
android.r8.gradual.support=true
org.gradle.configuration-cache=false
