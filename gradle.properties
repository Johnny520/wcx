org.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g -Xss512k -Dfile.encoding=UTF-8 -XX:+UseParallelGC -XX:ReservedCodeCacheSize=512m
org.gradle.parallel=false
org.gradle.caching=true
org.gradle.configureondemand=true
android.useAndroidX=true
kotlin.code.style=official
# Hchat 整树后 Kotlin 源码体量大，改用 in-process 编译（单 JVM），避免 kotlin daemon 与 gradle daemon 双堆超出 runner 7GB 内存
kotlin.compiler.execution.strategy=in-process
android.r8.maxWorkers=1
android.r8.gradual.support=true
org.gradle.configuration-cache=false
systemProp.org.gradle.internal.http.connectionTimeout=300000
systemProp.org.gradle.internal.http.socketTimeout=600000
# jvmTarget=21（miuix 0.9.4）：不锁定 installations.paths，直接使用 CI setup-java 的 JDK 21
android.builder.sdkDownload=false

# Hchat 脚本子系统整树后 Kotlin 源码体量增大（含 1MB 级单文件），daemon 默认堆不足

