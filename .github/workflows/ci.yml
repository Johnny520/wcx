name: CI

on:
  push:
    branches:
      - master
      - dev
    paths-ignore:
      - '**/*.md'
      - '**/*.txt'
      - '.editorconfig'
      - '.gitignore'
      - '.idea/**'
      - '**/*.js'
      - 'docs/**'
  pull_request:
    branches:
      - master
    paths-ignore:
      - '**/*.md'
      - '**/*.txt'
      - '.editorconfig'
      - '.gitignore'
      - '.idea/**'
      - '**/*.js'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' || 
      (
        !startsWith(github.event.head_commit.message, '[skip ci]') && 
        (
          github.ref == 'refs/heads/master' ||
          github.ref == 'refs/heads/dev' ||
          github.event_name == 'pull_request'
        )
      )
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@nightly
        with:
          targets: aarch64-linux-android,x86_64-linux-android,armv7-linux-androideabi,i686-linux-android

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          workspaces: . -> target

      - name: Cache Gradle build cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/configuration-cache
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', '**/gradle.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Install system dependencies
        run: |
          sudo apt install -y gcc-multilib

      - name: Build native library
        run: |
          cargo xtask configure
          cargo xtask build --native-only

      - name: Prepare keystore
        if: github.event_name != 'pull_request'
        run: |
          # Try the project keystore first; fall back to a freshly generated one
          # if the stored keystore is missing or incompatible with the CI JDK.
          KS_FILE="$RUNNER_TEMP/wekit-keystore.jks"
          CRED_FILE="$RUNNER_TEMP/keystore-creds.env"
          KS_PASS="wcx-store-pass"
          KEY_ALIAS="wcx"
          KEY_PASS="wcx-store-pass"

          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$KS_FILE" 2>/dev/null || true
            if keytool -list -keystore "$KS_FILE" -storepass "${{ secrets.KEYSTORE_PASSWORD }}" \
                 -alias "${{ secrets.KEY_ALIAS }}" >/dev/null 2>&1; then
              echo "Using project keystore."
              echo "KS_PASS=${{ secrets.KEYSTORE_PASSWORD }}" > "$CRED_FILE"
              echo "KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> "$CRED_FILE"
              echo "KEY_PASS=${{ secrets.KEY_PASSWORD }}" >> "$CRED_FILE"
              exit 0
            fi
            echo "Project keystore unreadable, generating a fresh one."
          fi

          rm -f "$KS_FILE"
          keytool -genkeypair -v \
            -keystore "$KS_FILE" \
            -storetype PKCS12 \
            -alias "$KEY_ALIAS" \
            -keyalg RSA -keysize 2048 \
            -validity 10000 \
            -storepass "$KS_PASS" \
            -keypass "$KEY_PASS" \
            -dname "CN=wcx, OU=CI, O=Johnny520, L=CI, S=CI, C=CN"
          echo "KS_PASS=$KS_PASS" > "$CRED_FILE"
          echo "KEY_ALIAS=$KEY_ALIAS" >> "$CRED_FILE"
          echo "KEY_PASS=$KEY_PASS" >> "$CRED_FILE"
          keytool -list -keystore "$KS_FILE" -storepass "$KS_PASS" -alias "$KEY_ALIAS"

      - name: Build Release (Signed)
        if: github.event_name != 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WEKIT_KEYSTORE_FILE: ${{ runner.temp }}/wekit-keystore.jks
        run: |
          source "$RUNNER_TEMP/keystore-creds.env"
          export WEKIT_KEYSTORE_PASSWORD="$KS_PASS"
          export WEKIT_KEY_ALIAS="$KEY_ALIAS"
          export WEKIT_KEY_PASSWORD="$KEY_PASS"
          ./gradlew assembleRelease --warning-mode all --stacktrace

      - name: Build Release (Unsigned)
        if: github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew assembleRelease --warning-mode all --stacktrace

      - name: Collect APKs
        run: |
          # Flavors nest output under apk/<flavor>/release/; flatten into one dir
          # so downstream jobs (release / telegram) keep a flat artifact layout.
          mkdir -p dist/apk
          find app/build/outputs/apk -type f -name '*.apk' -exec cp -v {} dist/apk/ \;
          echo "Collected APKs:"
          ls -1 dist/apk

      - name: Collect mappings
        run: |
          # One mapping.txt per flavor; rename per flavor to avoid collisions.
          mkdir -p dist/mapping
          for m in app/build/outputs/mapping/*/mapping.txt; do
            flavorDir=$(basename "$(dirname "$m")")   # e.g. standardRelease
            cp -v "$m" "dist/mapping/mapping-${flavorDir}.txt"
          done
          ls -1 dist/mapping || echo "(no mappings — unsigned PR build without minify?)"

      - name: Upload Release APKs
        uses: actions/upload-artifact@v7
        with:
          name: wcx-apk
          path: dist/apk/*.apk

      - name: Upload Release Obfuscation Mapping
        uses: actions/upload-artifact@v7
        with:
          name: wcx-mapping
          path: dist/mapping/*.txt

  release:
    needs: build
    runs-on: ubuntu-latest
    if: ${{ success() && github.ref == 'refs/heads/master' }}
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Download APK artifact
        uses: actions/download-artifact@v8
        with:
          name: wcx-apk
          path: artifacts

      - name: Generate version info
        id: version
        run: |
          COMMIT_COUNT=$(git rev-list --count HEAD)
          GIT_HASH=$(git rev-parse --short HEAD)
          VERSION_TAG="v${COMMIT_COUNT}"
          echo "tag=${VERSION_TAG}" >> $GITHUB_OUTPUT
          echo "hash=${GIT_HASH}" >> $GITHUB_OUTPUT
          echo "count=${COMMIT_COUNT}" >> $GITHUB_OUTPUT

          cat > artifacts/update.json <<EOF
          {
            "versionCode": ${COMMIT_COUNT},
            "versionName": "${VERSION_TAG}",
            "commit": "${GIT_HASH}"
          }
          EOF

          echo "Generated update.json:"
          cat artifacts/update.json

      - name: Create Release and upload APK
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: WCX ${{ steps.version.outputs.tag }}
          body: |
            ## WCX ${{ steps.version.outputs.tag }}

            正式发行版本

            提交 SHA: `${{ steps.version.outputs.hash }}`

            提交消息:
            ```
            ${{ github.event.head_commit.message || '手动构建' }}
            ```

            ### 下载
            - 下方 Assets 中下载对应架构的 APK
            - update.json 供模块内置更新器使用
          files: |
            artifacts/*.apk
            artifacts/update.json
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
